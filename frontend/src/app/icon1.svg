<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      /* 1. แอนิเมชันไฟสถานะกะพริบเปลี่ยนสี (เขียว -> ฟ้า -> เขียว) */
      @keyframes pulse-led {
        0%, 100% { fill: #10B981; filter: drop-shadow(0 0 2px #10B981); }
        50% { fill: #3B82F6; filter: drop-shadow(0 0 4px #3B82F6); }
      }

      /* 2. แอนิเมชันคลื่นสัญญาณ Wi-Fi จางเข้า-ออก */
      @keyframes wifi-signal {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      .led-dot {
        animation: pulse-led 2s infinite ease-in-out;
      }

      .wifi-wave {
        animation: wifi-signal 1.5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- พื้นหลังวงกลมสีเข้มให้เห็นชัดทุกธีม -->
  <circle cx="32" cy="32" r="30" fill="#141619" stroke="#2C2E3A" stroke-width="2" />

  <!-- ตัวถังขยะ (Smart Bin) -->
  <path d="M20 24h24v24a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V24z" fill="#2C2E3A" stroke="#4B5563" stroke-width="2" />
  <path d="M16 20h32v4H16z" fill="#050A44" rx="1" />
  <path d="M26 16h12v4H26z" fill="#050A44" rx="1" />

  <!-- คลื่นสัญญาณ IoT/Wi-Fi ด้านบน (ขยับได้) -->
  <path class="wifi-wave" d="M24 12 a10 10 0 0 1 16 0" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />

  <!-- จุดไฟ LED สถานะตรงกลางถัง (กะพริบได้) -->
  <circle class="led-dot" cx="32" cy="36" r="4" />
</svg>
